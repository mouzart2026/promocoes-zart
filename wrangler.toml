# PromoZart - Static Site for Cloudflare Pages

name = "promocoes-zart"
pages_build_output_dir = "site"
compatibility_date = "2024-01-01"

# Environment variables (set via Cloudflare Pages Dashboard or CLI)
# IMPORTANT: SUPABASE_ANON_KEY must be configured as a Secret:
#   npx wrangler pages secret put SUPABASE_ANON_KEY --project-name promocoes-zart
#   OR via Dashboard → Pages → promocoes-zart → Settings → Secrets
#
# The _worker.js Page Function reads env.SUPABASE_ANON_KEY at runtime
# and serves it to the frontend via /api/config endpoint.
[vars]
SUPABASE_URL = "https://innyohbvgtsoihooykxp.supabase.co"
SUPABASE_TABLE = "ofertas_encontradas"
SUPABASE_SELECT = "produto_id,titulo,preco_anterior,preco_novo,queda_pct,link,criado_em,plataforma"