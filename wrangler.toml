# PromoZart - Static Site for Cloudflare Pages

name = "promocoes-zart"
pages_build_output_dir = "site"
compatibility_date = "2024-01-01"

# Environment variables (set in Cloudflare Pages Dashboard → Settings → Environment variables)
# IMPORTANT: SUPABASE_ANON_KEY must be configured as a Secret in:
#   Pages → promocoes-zart → Settings → Secrets → "Add secret"
#   Name: SUPABASE_ANON_KEY
#   Value: (your Supabase anon/public key for project innyohbvgtsoihooykxp)
#
# The /api/config Page Function reads these secrets at runtime and serves them to the frontend.
[var]
SUPABASE_URL = "https://innyohbvgtsoihooykxp.supabase.co"