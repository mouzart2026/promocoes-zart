# PromoZart - Static Site for Cloudflare Pages

name = "promocoes-zart"
pages_build_output_dir = "site"
compatibility_date = "2024-01-01"

# Optional: custom domain configuration (uncomment and configure after adding domain in dashboard)
# [[pages_custom_domains]]
# domain = "promocoes.zart.com.br"

# Environment variables must be set in the Cloudflare Pages Dashboard:
# Pages → promocoes-zart → Settings → Environment variables → "Add variable"
#   Key: SUPABASE_ANON_KEY   Value: (your Supabase anon/public key)
#
# Cloudflare Pages substitutes %%SUPABASE_ANON_KEY%% in app.js with this value at the edge.
# No rebuild needed when rotating the key - just update the env var in the dashboard.