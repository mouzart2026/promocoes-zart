# Promoções Zart - Static Site for Cloudflare Pages

name = "promocoes-zart"
pages_build_output_dir = "site"
compatibility_date = "2024-01-01"

# Optional: custom domain configuration (uncomment and configure after adding domain in dashboard)
# [[pages_custom_domains]]
# domain = "promocoes.zart.com.br"

# Optional: environment variables (not needed for this static site since config is in app.js)
# [vars]
# SUPABASE_URL = "https://seu-projeto.supabase.co"
# SUPABASE_ANON_KEY = "sua-anon-key"

# Build command (not needed for pure static site, but useful if you add a build step later)
# build_command = "echo 'No build step required'"

# Redirects/headers can be added via _redirects and _headers files in site/
# See: https://developers.cloudflare.com/pages/platform/redirects/
# See: https://developers.cloudflare.com/pages/platform/headers/